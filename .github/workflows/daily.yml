name: daily

on:
  # The bulletin for day D is posted on the morning of D+1, refinery prices on working days. GitHub
  # delays scheduled runs by hours and drops some, so every hour, off the top of it: a run with nothing
  # new commits nothing, and a missed slot then costs an hour, not a day.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: New bulletins (download, parse, append, delete)
        run: uv run --script scripts/update_bulletins.py .

      - name: Refinery prices, ECB rate, EIA prices and outlook
        run: uv run --script scripts/build_open_data.py daily .

      - name: Model
        run: uv run --script scripts/build_outlook.py .

      - name: Data package descriptor
        run: python3 scripts/make_datapackage.py .

      - name: Validate (a failure stops the commit and the deploy)
        run: |
          uv run --script scripts/validate.py .
          uvx frictionless validate datapackage.json

      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data datapackage.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            latest=$(cat data/pump/[0-9]*.csv | cut -d, -f1 | grep -v date | sort | tail -n1)
            git commit -q -m "data: bulletin ${latest}"
            git pull --rebase -q
            git push -q
          fi

      - name: Build the site
        run: uv run --script scripts/build_site.py .

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - id: deploy
        uses: actions/deploy-pages@v4
